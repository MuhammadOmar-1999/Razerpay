    username: ${DB_USER:postgres}
    password: ${DB_PASS:srkzomar}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

