spring:
  application:
    name: razerpay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razerpay}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:srkzomar}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

vault:
  master-key: ${VAULT_MASTER_KEY:opiqa9ls09q28392f7891q243klnqaw09oq2390sdf}


payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NET-BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80
